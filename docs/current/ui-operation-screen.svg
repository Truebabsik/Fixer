<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Consolas, 'Courier New', monospace">
  <!-- ФОН -->
  <rect width="1400" height="880" fill="#080808"/>

  <!-- ВЕРХНЯЯ ПОЛОСА -->
  <rect x="0" y="0" width="1400" height="56" fill="#0e0e0e"/>
  <line x1="0" y1="56" x2="1400" y2="56" stroke="#6e6e6e" stroke-width="1"/>
  <text x="24" y="36" fill="#d6d6d6" font-size="14" letter-spacing="3">МЕРИДИАН // АРХИВНЫЙ КОМПЛЕКС</text>
  <text x="560" y="36" fill="#8e8e8e" font-size="14" letter-spacing="2">ЭТАЖ 4 // ИТ-ОТДЕЛ</text>
  <text x="1080" y="36" fill="#8e8e8e" font-size="14" letter-spacing="2">ПРИКАЗЫ</text>
  <circle cx="1200" cy="31" r="6" fill="#e8e8e8"/>
  <circle cx="1224" cy="31" r="6" fill="#e8e8e8"/>
  <circle cx="1248" cy="31" r="6" fill="none" stroke="#7a7a7a" stroke-width="1.5"/>

  <!-- КАРТА: КОНТУР ЗДАНИЯ -->
  <rect x="60" y="110" width="880" height="560" fill="#0b0b0b" stroke="#9a9a9a" stroke-width="1.5"/>

  <!-- КОРИДОР -->
  <rect x="60" y="350" width="880" height="80" fill="#121212"/>

  <!-- ВНУТРЕННИЕ СТЕНЫ: ВЕРХНИЕ КОМНАТЫ -->
  <line x1="340" y1="110" x2="340" y2="350" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="620" y1="110" x2="620" y2="350" stroke="#6a6a6a" stroke-width="1.5"/>

  <!-- ВНУТРЕННИЕ СТЕНЫ: НИЖНИЕ ПОМЕЩЕНИЯ -->
  <line x1="220" y1="430" x2="220" y2="670" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="390" y1="430" x2="390" y2="670" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="560" y1="430" x2="560" y2="670" stroke="#6a6a6a" stroke-width="1.5"/>

  <!-- ВЕРХНЯЯ СТЕНА КОРИДОРА С ПРОЁМАМИ ДВЕРЕЙ -->
  <line x1="60" y1="350" x2="180" y2="350" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="220" y1="350" x2="520" y2="350" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="560" y1="350" x2="700" y2="350" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="740" y1="350" x2="940" y2="350" stroke="#9a9a9a" stroke-width="1.5"/>

  <!-- НИЖНЯЯ СТЕНА КОРИДОРА С ПРОЁМАМИ -->
  <line x1="60" y1="430" x2="160" y2="430" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="200" y1="430" x2="300" y2="430" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="340" y1="430" x2="430" y2="430" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="470" y1="430" x2="600" y2="430" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="640" y1="430" x2="940" y2="430" stroke="#9a9a9a" stroke-width="1.5"/>

  <!-- ДВЕРИ: ТОНКИЕ ОТМЕТКИ В ПРОЁМАХ -->
  <line x1="180" y1="350" x2="220" y2="350" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="520" y1="350" x2="560" y2="350" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="700" y1="350" x2="740" y2="350" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="160" y1="430" x2="200" y2="430" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="300" y1="430" x2="340" y2="430" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="430" y1="430" x2="470" y2="430" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="600" y1="430" x2="640" y2="430" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- СЕРВЕРНАЯ (ВНУТРИ ИТ-ОТДЕЛА) -->
  <rect x="760" y="150" width="170" height="150" fill="#141414" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="800" y="230" fill="#d0d0d0" font-size="13" letter-spacing="2">СЕРВЕРНАЯ</text>
  <!-- БИОМЕТРИЧЕСКАЯ ДВЕРЬ: ДВОЙНАЯ ОТМЕТКА -->
  <line x1="820" y1="300" x2="820" y2="318" stroke="#e8e8e8" stroke-width="2"/>
  <line x1="828" y1="300" x2="828" y2="318" stroke="#e8e8e8" stroke-width="2"/>
  <text x="700" y="340" fill="#9e9e9e" font-size="11" letter-spacing="1">БИОМЕТРИЯ</text>
  <!-- ТОЧКА ДОСТУПА -->
  <rect x="600" y="176" width="10" height="10" transform="rotate(45 605 181)" fill="none" stroke="#bdbdbd" stroke-width="1.5"/>

  <!-- ПОДПИСИ ПОМЕЩЕНИЙ -->
  <text x="80" y="136" fill="#6e6e6e" font-size="12" letter-spacing="2">ОФИС</text>
  <text x="360" y="136" fill="#6e6e6e" font-size="12" letter-spacing="2">ПЕРЕГОВОРНАЯ</text>
  <text x="640" y="136" fill="#6e6e6e" font-size="12" letter-spacing="2">ИТ-ОТДЕЛ</text>
  <text x="80" y="656" fill="#6e6e6e" font-size="12" letter-spacing="2">ЛК</text>
  <text x="240" y="656" fill="#6e6e6e" font-size="12" letter-spacing="2">Л1 ПАСС.</text>
  <text x="410" y="656" fill="#6e6e6e" font-size="12" letter-spacing="2">Л2 ГРУЗ.</text>
  <text x="590" y="656" fill="#6e6e6e" font-size="12" letter-spacing="2">ДЕЖУРКА</text>

  <!-- ЗОНА СЕНСОРОВ (ЭХО) -->
  <circle cx="560" cy="390" r="150" fill="none" stroke="#3c3c3c" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ПРИЗРАК ПАТРУЛЯ: РАСХОЖДЕНИЕ С РЕАЛЬНОСТЬЮ -->
  <circle cx="200" cy="210" r="8" fill="none" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="216" y="206" fill="#5a5a5a" font-size="11">ПАТРУЛЬ 02:00</text>
  <text x="216" y="222" fill="#8a8a8a" font-size="11">данные устарели на 7 ч</text>
  <line x1="200" y1="218" x2="200" y2="336" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="150" y="286" fill="#8a8a8a" font-size="11">НЕ СОВПАЛО</text>

  <!-- ОХРАНА (КРАСНЫЙ ТРЕУГОЛЬНИК) -->
  <polygon points="756,378 748,392 764,392" fill="#c83232"/>
  <text x="772" y="388" fill="#c83232" font-size="12" letter-spacing="1">ОХРАНА</text>

  <!-- СВОИ: КИРА (КВАДРАТ), ЭХО (КРУГ) -->
  <rect x="466" y="382" width="13" height="13" fill="#f0f0f0"/>
  <text x="486" y="393" fill="#e8e8e8" font-size="12" letter-spacing="1">КИРА</text>
  <circle cx="540" cy="389" r="7" fill="#f0f0f0"/>
  <text x="554" y="393" fill="#e8e8e8" font-size="12" letter-spacing="1">ЭХО</text>

  <!-- ВОШЁЛ ЧЕРЕЗ ДОК: МЕТКА СТАРТА -->
  <text x="410" y="470" fill="#7a7a7a" font-size="11" letter-spacing="1">ВХОД: ГРУЗОВОЙ ДОК 00:41</text>

  <!-- ПРАВАЯ ПАНЕЛЬ: ПОТОК -->
  <line x1="1000" y1="76" x2="1000" y2="700" stroke="#4a4a4a" stroke-width="1"/>
  <text x="1024" y="104" fill="#9e9e9e" font-size="13" letter-spacing="3">ПОТОК</text>
  <line x1="1024" y1="116" x2="1376" y2="116" stroke="#3a3a3a" stroke-width="1"/>

  <text x="1024" y="144" fill="#8a8a8a" font-size="12">&gt; группа в коридоре 4 этажа</text>
  <text x="1024" y="170" fill="#8a8a8a" font-size="12">&gt; эхо: биометрия на двери</text>
  <text x="1024" y="196" fill="#8a8a8a" font-size="12">&gt; дверь не открывается</text>
  <text x="1024" y="222" fill="#c83232" font-size="12">&gt; патруль не по расписанию</text>
  <text x="1024" y="248" fill="#8a8a8a" font-size="12">&gt; инженер внутри, не спит</text>
  <text x="1024" y="290" fill="#6e6e6e" font-size="12" font-style="italic">Ты снова молчишь.</text>

  <line x1="1024" y1="330" x2="1376" y2="330" stroke="#3a3a3a" stroke-width="1"/>
  <text x="1024" y="358" fill="#7a7a7a" font-size="12" letter-spacing="3">ЭФИР</text>
  <rect x="1024" y="368" width="352" height="12" fill="none" stroke="#5a5a5a" stroke-width="1"/>
  <rect x="1025" y="369" width="141" height="10" fill="#b8b8b8"/>
  <line x1="1235" y1="362" x2="1235" y2="386" stroke="#c83232" stroke-width="1.5"/>
  <text x="1196" y="404" fill="#c83232" font-size="11">глушение</text>
  <text x="1024" y="404" fill="#8a8a8a" font-size="11">1 передача · ещё 2 до перехвата</text>
  <text x="1024" y="426" fill="#6e6e6e" font-size="11">затухание −2 / 5 шагов</text>

  <line x1="1024" y1="600" x2="1376" y2="600" stroke="#3a3a3a" stroke-width="1"/>
  <text x="1024" y="628" fill="#7a7a7a" font-size="12" letter-spacing="3">КОМАНДУЕТ</text>
  <text x="1024" y="662" fill="#f0f0f0" font-size="22" letter-spacing="6">КИРА</text>
  <text x="1024" y="686" fill="#6e6e6e" font-size="11">ты не удерживал связь 4 шага</text>

  <!-- НИЖНЕЕ ОКНО РЕШЕНИЯ -->
  <rect x="20" y="716" width="1360" height="140" fill="#111111" stroke="#d0d0d0" stroke-width="1.5"/>
  <text x="44" y="744" fill="#8a8a8a" font-size="12" letter-spacing="4">СВЯЗЬ НА УДЕРЖАНИИ</text>
  <text x="44" y="774" fill="#e0e0e0" font-size="15">Дверь серверной: биометрия. Внутри — дежурный инженер.</text>

  <text x="44" y="812" fill="#d0d0d0" font-size="14">[1] ВЗЛОМАТЬ — тихо, но долго</text>
  <text x="44" y="838" fill="#d0d0d0" font-size="14">[2] ВЫМАНИТЬ ИНЖЕНЕРА — нужна легенда</text>
  <text x="600" y="812" fill="#f0f0f0" font-size="14">[3] МОЛЧАТЬ — Кира решит сама</text>
  <text x="600" y="838" fill="#7a7a7a" font-size="12">по плану она обойдёт через 2-й этаж: +6 шагов</text>

  <text x="1140" y="788" fill="#9e9e9e" font-size="13" letter-spacing="2">ПРИКАЗОВ</text>
  <text x="1276" y="790" fill="#e8e8e8" font-size="18" letter-spacing="2">2 / 3</text>
  <text x="1140" y="818" fill="#9e9e9e" font-size="13" letter-spacing="2">ЭФИР</text>
  <text x="1276" y="820" fill="#e8e8e8" font-size="18" letter-spacing="2">1 → 2</text>
  <text x="1140" y="840" fill="#6e6e6e" font-size="11">каждый приказ — передача</text>
</svg>
